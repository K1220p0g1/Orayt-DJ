name: Build Virtual DJ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'virtualdj-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: unzip -q virtualdj-project.zip -d project

      - name: Locate project folder
        run: echo "PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n1)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualDJ-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
